name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Assemble and verify app bundle
        run: ./assemble_app.sh

      - name: Install the Apple Silicon speech runtime for release verification
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify a real speech fixture through the assembled app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          FERMION_DEVICE: mlx
          ECHO_FERMION_DEVICE: mlx
        run: |
          python -m pip install fermion-research mlx mlx-audio mlx-lm soundfile scipy zstandard
          # Warm the model before using the app's interactive inference timeout.
          fermion transcribe phonon-2 test_samples/short_sample_16k.wav
          ./Echo.app/Contents/MacOS/Echo --test --verify-speech test_samples/short_sample_16k.wav
